<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <radialGradient id="wave" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#a5b4fc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a5b4fc" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- asphalt and road -->
  <rect x="40" y="40" width="720" height="420" rx="24" fill="#0b0a1f" fill-opacity="0.55"/>
  <rect x="40" y="215" width="720" height="70" fill="#0b0a1f" fill-opacity="0.45"/>
  <g stroke="#e0e7ff" stroke-opacity="0.5" stroke-width="4" stroke-dasharray="26 22">
    <line x1="70" y1="250" x2="740" y2="250"/>
  </g>

  <!-- parking bays, top row -->
  <g stroke="#e0e7ff" stroke-opacity="0.7" stroke-width="4">
    <line x1="160" y1="60" x2="160" y2="200"/><line x1="280" y1="60" x2="280" y2="200"/>
    <line x1="400" y1="60" x2="400" y2="200"/><line x1="520" y1="60" x2="520" y2="200"/>
    <line x1="640" y1="60" x2="640" y2="200"/>
    <line x1="160" y1="300" x2="160" y2="440"/><line x1="280" y1="300" x2="280" y2="440"/>
    <line x1="400" y1="300" x2="400" y2="440"/><line x1="520" y1="300" x2="520" y2="440"/>
    <line x1="640" y1="300" x2="640" y2="440"/>
  </g>

  <!-- cars (top view) -->
  <g>
    <rect x="182" y="78" width="76" height="110" rx="18" fill="#6366f1"/>
    <rect x="194" y="96" width="52" height="26" rx="8" fill="#e0e7ff" fill-opacity="0.8"/>
    <rect x="422" y="78" width="76" height="110" rx="18" fill="#a5b4fc"/>
    <rect x="434" y="96" width="52" height="26" rx="8" fill="#1e1b4b" fill-opacity="0.7"/>
    <rect x="302" y="312" width="76" height="110" rx="18" fill="#4338ca"/>
    <rect x="314" y="380" width="52" height="26" rx="8" fill="#e0e7ff" fill-opacity="0.8"/>
    <rect x="542" y="312" width="76" height="110" rx="18" fill="#e0e7ff"/>
    <rect x="554" y="380" width="52" height="26" rx="8" fill="#4338ca" fill-opacity="0.7"/>
  </g>

  <!-- free bays: sensor waves -->
  <g>
    <path d="M300 70 h80 l-40 120 z" fill="url(#wave)"/>
    <circle cx="340" cy="70" r="7" fill="#a5b4fc"/>
    <path d="M540 70 h80 l-40 120 z" fill="url(#wave)"/>
    <circle cx="580" cy="70" r="7" fill="#a5b4fc"/>
    <path d="M180 430 h80 l-40 -120 z" fill="url(#wave)" transform="rotate(180 220 370)"/>
    <circle cx="220" cy="430" r="7" fill="#a5b4fc"/>
  </g>

  <!-- entrance barrier (servo) -->
  <rect x="660" y="226" width="22" height="48" rx="6" fill="#e0e7ff"/>
  <rect x="682" y="186" width="10" height="64" rx="4" fill="#6366f1" transform="rotate(-50 682 246)"/>

  <!-- LCD display -->
  <g transform="translate(60 214)">
    <rect width="190" height="72" rx="12" fill="#0b0a1f" stroke="#a5b4fc" stroke-width="2"/>
    <text x="16" y="30" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#a5b4fc">FREE SPACES</text>
    <text x="16" y="58" font-family="ui-monospace, Menlo, monospace" font-size="24" font-weight="700" fill="#f8faff">4 / 8</text>
  </g>
</svg>
